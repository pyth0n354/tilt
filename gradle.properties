org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft 26.x requires JDK 25. build.gradle resolves one via a Gradle toolchain, so a
# fresh clone builds with no local edits. Override per machine in ~/.gradle/gradle.properties
# if auto detection cannot find your JDK.

# https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod
version=0.1.0
maven_group=io.github.pyth0n354
archives_base_name=tilt

# Deps
fabric_api_version=0.160.7+26.3
yacl_version=3.9.6+26.3-fabric
modmenu_version=21.0.0-beta.1
